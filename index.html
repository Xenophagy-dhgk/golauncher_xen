<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Go Launcher</title>

    <!-- Ikon -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1DZ-6GpBslhuGgYM3WzMqRwyixoY6n-yd=w32">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1DZ-6GpBslhuGgYM3WzMqRwyixoY6n-yd=w180">

    <style>
        /* 1. Reset layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* Anti-geser di HP */
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 2. Iframe & Potongan Header 45px */
        iframe {
            position: absolute;
            top: -45px; /* Tarik ke atas 45px */
            left: 0;
            width: 100%;
            height: calc(100% + 45px); /* Tambah tinggi 45px agar bawah tetap pas */
            padding-top: 45px; /* Dorong konten asli kembali ke bawah */
            box-sizing: border-box; /* SANGAT PENTING: Agar tinggi total tidak membengkak */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbyFo5eqoHD2YL0UPvSFpsYUR_dfaj4ArWOds3R2heoeUq7iNWiWq76TOlcI9CJPQmxo/exec?v=2" 
        title="Go Launcher" 
        allow="clipboard-read; clipboard-write; fullscreen; autoplay">
    </iframe>

</body>
</html>
